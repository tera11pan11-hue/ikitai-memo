<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5ef">
<title>行きたいところ帳</title>
<style>
:root{--bg:#f7f5ef;--card:#fff;--ink:#25251f;--muted:#73736a;--line:#e7e3d9;--accent:#3d6654;--accent2:#e8f0e9;--danger:#a34136}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:820px;margin:auto;padding:22px 15px 60px}h1{font-size:clamp(1.55rem,5vw,2.2rem);margin:0 0 6px}h2{font-size:1.15rem}.sub{color:var(--muted);margin:0 0 22px;font-size:.93rem}button,input,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:white;color:var(--ink)}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{opacity:.5}#loginCard,.panel,.place,.roomcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin:13px 0}#loginCard{text-align:center;padding:28px 18px}.small{font-size:.84rem;color:var(--muted)}.hidden{display:none!important}.userbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.userbar img{width:36px;height:36px;border-radius:50%}.push{flex:1}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}label{font-size:.85rem;color:var(--muted);display:block;margin:0 0 5px}input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:white;color:var(--ink)}textarea{min-height:72px;resize:vertical}.actions,.placeactions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.filters{display:flex;gap:7px;overflow:auto;padding:5px 0 9px}.filter{white-space:nowrap}.filter.active{background:var(--accent2);border-color:#b9cbbb;color:var(--accent);font-weight:650}.place{padding:15px;margin:10px 0}.placehead{display:flex;gap:10px;align-items:flex-start}.place h3{margin:0;font-size:1.08rem;overflow-wrap:anywhere}.note{white-space:pre-wrap;margin:9px 0;color:#55554d;overflow-wrap:anywhere}.meta{font-size:.78rem;color:var(--muted);margin-top:7px;line-height:1.6}.badge{display:inline-block;border-radius:999px;padding:3px 8px;background:#f0eee8;font-size:.75rem;margin-left:6px}.visited{opacity:.72}.visited h3{text-decoration:line-through}.placecheck{width:20px;height:20px;flex:none;margin-top:2px;accent-color:var(--accent)}.placeactions button{font-size:.86rem;padding:7px 10px}.placeactions .del{color:var(--danger)}#status{padding:10px 12px;border-radius:10px;background:#f0eee8;color:var(--muted);font-size:.85rem;margin:10px 0}.empty{text-align:center;padding:28px 10px;color:var(--muted)}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.sectionhead h2{margin:0}#peopleFilters{display:flex;gap:7px;flex-wrap:wrap;margin:6px 0 12px}.roomcard{display:flex;align-items:center;gap:12px}.roomicon{width:45px;height:45px;display:grid;place-items:center;background:var(--accent2);border-radius:13px;font-size:1.35rem;flex:none}.roominfo{flex:1;min-width:0}.roominfo strong{display:block;overflow-wrap:anywhere}.roominfo p{margin:4px 0 0}.roomhead{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}.link{color:var(--accent);overflow-wrap:anywhere}.memberlist{font-size:.83rem;color:var(--muted);margin-top:7px}.hint{background:#f0eee8;padding:10px 12px;border-radius:11px;font-size:.84rem;color:var(--muted)}
@media(max-width:560px){main{padding:17px 12px 45px}.fields{grid-template-columns:1fr}.wide{grid-column:auto}.panel{padding:14px}}
</style></head><body><main>
<header><h1>行きたいところ帳 📍</h1><p class="sub">一緒に行きたい場所を、部屋ごとに集めよう。</p></header>
<section id="loginCard"><h2>ログインして使おう</h2><p class="small">Googleアカウントでログイン。部屋を作ったり、招待リンクから参加したりできます。</p><button class="primary" id="loginBtn">Googleでログイン</button><p class="small" id="loginError"></p></section>
<section id="app" class="hidden"><div class="panel"><div class="userbar"><img id="avatar" alt="" class="hidden"><div><strong id="userName"></strong><div class="small" id="userEmail"></div></div><span class="push"></span><button id="logoutBtn">ログアウト</button></div></div>
<section id="homeView"><div class="sectionhead"><h2>共有している部屋</h2></div><p class="small">二人でも、三人以上でもOK。部屋ごとに行きたい場所が分かれます。</p><div id="roomList"><div class="empty">読み込み中…</div></div>
<div class="panel"><h2>新しい部屋を作る</h2><form id="createRoomForm"><label for="newRoomName">部屋の名前</label><input id="newRoomName" maxlength="80" required placeholder="例：彼氏と行きたいところ／いつもの3人"><div class="actions"><button class="primary" type="submit" id="createRoomBtn">部屋を作成</button></div></form></div>
<div class="panel"><h2>招待リンクから参加</h2><p class="small">友達から受け取った招待リンクを開くと、その部屋に参加できます。</p><label for="joinRoomId">部屋コード（リンク末尾の room= の値）</label><input id="joinRoomId" placeholder="部屋コードを貼り付け"><div class="actions"><button id="joinRoomBtn" class="primary" type="button">この部屋に参加</button></div><p class="small" id="joinMessage"></p></div></section>
<section id="roomView" class="hidden"><div class="panel"><button id="backHome">← 部屋一覧</button><h2 id="roomTitle"></h2><div id="roomMembers" class="memberlist"></div><p class="small">この部屋の招待リンクを、参加してほしい人にだけ送ってね。</p><div class="hint"><div id="inviteUrl" class="link"></div><div class="actions"><button id="copyInvite">招待リンクをコピー</button></div></div></div>
<div id="status">接続中…</div><section class="panel"><h2 id="formTitle">場所を追加</h2><form id="placeForm"><input type="hidden" id="editId"><div class="fields" style="margin-top:12px"><div class="wide"><label for="placeName">場所・お店の名前 *</label><input id="placeName" maxlength="120" required placeholder="例：行ってみたい水族館／カフェ"></div><div><label for="tabelogUrl">食べログURL</label><input id="tabelogUrl" type="url" placeholder="https://tabelog.com/..."></div><div><label for="mapUrl">GoogleマップURL</label><input id="mapUrl" type="url" placeholder="https://maps.app.goo.gl/..."></div><div class="wide"><label for="placeNote">メモ（任意）</label><textarea id="placeNote" maxlength="1500" placeholder="気になるメニュー、予算、行きたい理由など"></textarea></div></div><div class="actions"><button class="primary" id="saveBtn" type="submit">追加する</button><button type="button" id="cancelEdit" class="hidden">編集をキャンセル</button></div></form></section>
<section class="panel"><label for="search">場所を検索</label><input id="search" placeholder="場所名・メモで検索"><div class="filters" id="statusFilters"><button class="filter active" data-status="all">すべて</button><button class="filter" data-status="unvisited">未訪問</button><button class="filter" data-status="visited">行った</button></div><label>追加した人で絞り込む</label><div id="peopleFilters"></div><div class="sectionhead"><h2>場所一覧</h2><span class="small" id="count"></span></div><div id="places"><div class="empty">読み込み中…</div></div></section></section></section></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,collection,addDoc,doc,getDoc,updateDoc,deleteDoc,onSnapshot,query,orderBy,where,serverTimestamp,arrayUnion} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyApyOHDmD0N8K4knVjKFJXtKH56IB9N5c8",authDomain:"ikitaitokoro-d1b97.firebaseapp.com",projectId:"ikitaitokoro-d1b97",storageBucket:"ikitaitokoro-d1b97.firebasestorage.app",messagingSenderId:"658300398303",appId:"1:658300398303:web:1f8e42536fb2871e0d976a",measurementId:"G-25R11QH32T"};
const $=id=>document.getElementById(id),app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);let user=null,rooms=[],activeRoom=null,places=[],stopRooms=null,stopPlaces=null,statusFilter="all",personFilter="all";
const name=()=>user?.displayName||user?.email||"Googleユーザー";const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function showHome(){if(stopPlaces){stopPlaces();stopPlaces=null}activeRoom=null;$("homeView").classList.remove("hidden");$("roomView").classList.add("hidden")}
function renderRooms(){$("roomList").innerHTML=rooms.length?rooms.map(r=>`<div class="roomcard"><div class="roomicon">📍</div><div class="roominfo"><strong>${esc(r.name)}</strong><p class="small">${(r.memberUids||[]).length}人で共有中</p></div><button data-open="${esc(r.id)}">開く</button></div>`).join(""):'<div class="empty">まだ部屋がありません。下から作成するか、招待リンクで参加しよう。</div>';document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openRoom(b.dataset.open))}
async function openRoom(id){let r=rooms.find(x=>x.id===id);if(!r){const s=await getDoc(doc(db,"rooms",id));if(!s.exists())throw Error("部屋が見つかりません");r={id,...s.data()}}activeRoom=r;$("homeView").classList.add("hidden");$("roomView").classList.remove("hidden");$("roomTitle").textContent=r.name;$("roomMembers").textContent="参加メンバー："+(r.memberNames||[]).join("、");const u=new URL(location.href);u.searchParams.set("room",id);$("inviteUrl").textContent=u.toString();if(stopPlaces)stopPlaces();$("status").textContent="場所を読み込み中…";stopPlaces=onSnapshot(query(collection(db,"rooms",id,"places"),orderBy("createdAt","desc")),s=>{places=s.docs.map(d=>({id:d.id,...d.data()}));$("status").textContent="リアルタイムで共有中";renderPlaces()},e=>{$("status").textContent="読み込み失敗：Firestoreルールを確認してください";console.error(e)})}
async function joinRoom(id){id=(id||"").trim();if(!id){$("joinMessage").textContent="部屋コードを入力してください";return}try{const ref=doc(db,"rooms",id),s=await getDoc(ref);if(!s.exists())throw Error("部屋が見つかりません");const d=s.data();if(!(d.memberUids||[]).includes(user.uid))await updateDoc(ref,{memberUids:arrayUnion(user.uid),memberNames:arrayUnion(name()),updatedAt:serverTimestamp()});$("joinMessage").textContent="参加しました";await openRoom(id)}catch(e){console.error(e);$("joinMessage").textContent="参加できませんでした。招待コードとFirestoreルールを確認してください。"}}
function renderPeople(){const people=[...new Map(places.map(p=>[p.createdByUid,{uid:p.createdByUid,name:p.createdByName||"メンバー"}])).values()];$("peopleFilters").innerHTML=[{uid:"all",name:"全員"},...people].map(p=>`<button class="filter ${personFilter===p.uid?"active":""}" data-person="${esc(p.uid)}">${esc(p.name)}</button>`).join("");document.querySelectorAll("[data-person]").forEach(b=>b.onclick=()=>{personFilter=b.dataset.person;renderPlaces()})}
function renderPlaces(){renderPeople();const term=$("search").value.trim().toLowerCase(),list=places.filter(p=>(statusFilter==="all"||(statusFilter==="visited"&&p.visited)||(statusFilter==="unvisited"&&!p.visited))&&(personFilter==="all"||p.createdByUid===personFilter)&&(!term||`${p.name} ${p.note||""}`.toLowerCase().includes(term)));$("count").textContent=`${list.length}件`;$("places").innerHTML=list.length?list.map(p=>`<article class="place ${p.visited?"visited":""}"><div class="placehead"><input class="placecheck" type="checkbox" data-visit="${esc(p.id)}" ${p.visited?"checked":""}><div style="flex:1;min-width:0"><h3>${esc(p.name)}${p.visited?'<span class="badge">行った</span>':""}</h3>${p.note?`<p class="note">${esc(p.note)}</p>`:""}<div class="meta">追加：${esc(p.createdByName||"メンバー")} ／ 最終編集：${esc(p.updatedByName||p.createdByName||"メンバー")}</div><div class="placeactions">${p.mapUrl?`<a class="link" href="${esc(p.mapUrl)}" target="_blank" rel="noopener">Googleマップ</a>`:""}${p.tabelogUrl?`<a class="link" href="${esc(p.tabelogUrl)}" target="_blank" rel="noopener">食べログ</a>`:""}<button data-edit="${esc(p.id)}">編集</button><button class="del" data-del="${esc(p.id)}">削除</button></div></div></div></article>`).join(''):'<div class="empty">該当する場所はありません。</div>';document.querySelectorAll("[data-visit]").forEach(el=>el.onchange=()=>changePlace(el.dataset.visit,{visited:el.checked}));document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editPlace(b.dataset.edit));document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>deletePlace(b.dataset.del))}
async function changePlace(id,data){try{await updateDoc(doc(db,"rooms",activeRoom.id,"places",id),{...data,updatedByUid:user.uid,updatedByName:name(),updatedAt:serverTimestamp()})}catch(e){alert("更新できませんでした。ルールを確認してください。");console.error(e)}}
function resetForm(){$("placeForm").reset();$("editId").value="";$("formTitle").textContent="場所を追加";$("saveBtn").textContent="追加する";$("cancelEdit").classList.add("hidden")}
function editPlace(id){const p=places.find(x=>x.id===id);if(!p)return;$("editId").value=id;$("placeName").value=p.name||"";$("tabelogUrl").value=p.tabelogUrl||"";$("mapUrl").value=p.mapUrl||"";$("placeNote").value=p.note||"";$("formTitle").textContent="場所を編集";$("saveBtn").textContent="変更を保存";$("cancelEdit").classList.remove("hidden");$("placeName").scrollIntoView({behavior:"smooth",block:"center"})}
async function deletePlace(id){if(!confirm("この場所を削除しますか？"))return;try{await deleteDoc(doc(db,"rooms",activeRoom.id,"places",id))}catch(e){alert("削除できませんでした。");console.error(e)}}
$("loginBtn").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider());$("loginError").textContent=""}catch(e){const m={"auth/unauthorized-domain":"このドメインはFirebaseで承認されていません。Authenticationの承認済みドメインに追加してください。","auth/popup-blocked":"ポップアップがブロックされました。Safariの設定を確認してください。","auth/popup-closed-by-user":"ログイン画面が閉じられました。"};$("loginError").textContent=m[e.code]||`ログイン失敗：${e.code||e.message}`}};
$("logoutBtn").onclick=()=>signOut(auth);onAuthStateChanged(auth,async u=>{user=u;$("loginCard").classList.toggle("hidden",!!u);$("app").classList.toggle("hidden",!u);if(!u){if(stopRooms)stopRooms();if(stopPlaces)stopPlaces();stopRooms=stopPlaces=null;showHome();return}$("userName").textContent=name();$("userEmail").textContent=u.email||"";if(u.photoURL){$("avatar").src=u.photoURL;$("avatar").classList.remove("hidden")}if(stopRooms)stopRooms();stopRooms=onSnapshot(query(collection(db,"rooms"),where("memberUids","array-contains",u.uid)),s=>{rooms=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||"").localeCompare(b.name||"","ja"));renderRooms()},e=>{console.error(e);$("roomList").textContent="部屋一覧を読み込めません。Firestoreルールを確認してください。"});const invite=new URL(location.href).searchParams.get("room");if(invite){$("joinRoomId").value=invite;await joinRoom(invite);history.replaceState(null,"",location.pathname+location.hash)}else showHome()});
$("createRoomForm").onsubmit=async e=>{e.preventDefault();const n=$("newRoomName").value.trim();if(!n)return;$("createRoomBtn").disabled=true;try{const ref=await addDoc(collection(db,"rooms"),{name:n,ownerUid:user.uid,memberUids:[user.uid],memberNames:[name()],createdAt:serverTimestamp(),updatedAt:serverTimestamp()});$("newRoomName").value="";await openRoom(ref.id)}catch(e){console.error(e);alert("部屋を作成できませんでした。Firestoreルールを確認してください。")}finally{$("createRoomBtn").disabled=false}};
$("joinRoomBtn").onclick=()=>joinRoom($("joinRoomId").value);$("backHome").onclick=showHome;$("copyInvite").onclick=async()=>{try{await navigator.clipboard.writeText($("inviteUrl").textContent);$("copyInvite").textContent="コピーしました！"}catch(e){prompt("このリンクをコピーしてください",$("inviteUrl").textContent)}};
$("placeForm").onsubmit=async e=>{e.preventDefault();if(!activeRoom)return;const id=$("editId").value,p={name:$("placeName").value.trim(),tabelogUrl:$("tabelogUrl").value.trim(),mapUrl:$("mapUrl").value.trim(),note:$("placeNote").value.trim(),updatedByUid:user.uid,updatedByName:name(),updatedAt:serverTimestamp()};$("saveBtn").disabled=true;try{if(id)await updateDoc(doc(db,"rooms",activeRoom.id,"places",id),p);else await addDoc(collection(db,"rooms",activeRoom.id,"places"),{...p,visited:false,createdByUid:user.uid,createdByName:name(),createdAt:serverTimestamp()});resetForm()}catch(e){console.error(e);alert("保存できませんでした。Firestoreルールを確認してください。")}finally{$("saveBtn").disabled=false}};
$("cancelEdit").onclick=resetForm;$("search").oninput=renderPlaces;document.querySelectorAll("[data-status]").forEach(b=>b.onclick=()=>{statusFilter=b.dataset.status;document.querySelectorAll("[data-status]").forEach(x=>x.classList.toggle("active",x===b));renderPlaces()});
</script></body></html>
